name: Release

# Tags only: a manual run on a branch would publish a Release labelled with a branch name.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # WindowsPackageType=None + WindowsAppSDKSelfContained=true in the .csproj make this output
      # a fully standalone folder: no installer, no Windows App SDK runtime, no .NET runtime needed.
      - name: Publish standalone unpackaged app
        run: >
          dotnet publish "SuperMediaSuites.csproj" -c Release -p:Platform=x64
          -o "publish/SuperMediaSuites_Portable"

      # Self-contained Windows App SDK publish silently drops the app PRI; without resources.pri the
      # exe dies at startup with a XamlParseException (0xC000027B). Fail loudly instead.
      - name: Verify the app PRI is present
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish/SuperMediaSuites_Portable/resources.pri')) {
            throw 'App PRI missing from publish output'
          }
          if (-not (Test-Path 'publish/SuperMediaSuites_Portable/SuperMediaSuites.exe')) {
            throw 'App executable missing from publish output'
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/SuperMediaSuites_Portable/*" `
                           -DestinationPath "SuperMediaSuites-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: SuperMediaSuites-*-win-x64.zip
          generate_release_notes: true
          overwrite: true
